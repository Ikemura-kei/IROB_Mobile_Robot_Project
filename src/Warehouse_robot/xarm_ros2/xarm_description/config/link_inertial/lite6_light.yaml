# Lite6 link inertial parameters, scaled to 1/6 of the real robot.
#
# Generated from xarm6_type9_HT_BR2.yaml (the stock Lite6 table) by dividing every
# mass and every inertia tensor component by 6. Centres of mass (origin) are
# unchanged, so the arm keeps its real geometry and only gets lighter.
#
# Rationale: the real Lite6 (~7.7 kg incl. base and vacuum gripper) mounted 0.3 m
# above the TurtleBot4 shell puts the combined centre of mass high enough that the
# base tips when the arm swings out. This lightened table keeps the simulation
# tractable for the assignment. It is NOT physically accurate -- do not use it for
# payload, torque or motor-sizing analysis.
#
# Two entries here have no counterpart in the stock table, because upstream
# hardcodes them rather than reading them from YAML:
#   link_base      -- fallback lives in lite6/lite6.urdf.xacro
#   vacuum_gripper -- fallback lives in vacuum_gripper/lite_vacuum_gripper.urdf.xacro
# Both xacros use their hardcoded value when the key is absent, so stock tables
# are unaffected.
#
# To change the scale factor, re-derive from xarm6_type9_HT_BR2.yaml rather than
# editing these numbers in place.

