controller_manager:
  ros__parameters:
    update_rate: 150  # Hz

    # Only include the traj controller here. The standard JSB is handled by the TB4 control file.
    lite6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController

lite6_traj_controller:
  ros__parameters:
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    
    # EXACT JOINT NAMES FROM XACRO PREFIX
    joints:
      - arm_joint1
      - arm_joint2
      - arm_joint3
      - arm_joint4
      - arm_joint5
      - arm_joint6
      
    constraints:
      goal_time: 0.5
      stopped_velocity_tolerance: 0.0
      arm_joint1: {trajectory: 1.0, goal: 0.01}
      arm_joint2: {trajectory: 1.0, goal: 0.01}
      arm_joint3: {trajectory: 1.0, goal: 0.01}
      arm_joint4: {trajectory: 1.0, goal: 0.01}
      arm_joint5: {trajectory: 1.0, goal: 0.01}
      arm_joint6: {trajectory: 1.0, goal: 0.01}
      
    interface_name: position
    state_publish_rate: 25.0
    action_monitor_rate: 10.0

    